<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ask me anything</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <main class="screen" id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-dot" aria-hidden="true"></span>
          <span id="brand-name" class="brand-name">Ask&nbsp;me</span>
        </div>
        <div class="topbar-right">
          <span id="kb-badge" class="badge">connecting…</span>
          <button id="mute-toggle" class="icon-btn" type="button" aria-pressed="false" title="Mute spoken replies">
            <svg id="mute-icon-on" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 9v6h4l5 5V4L8 9H4Z" />
              <path d="M16.5 8.5a5 5 0 0 1 0 7" />
              <path d="M19 6a8.5 8.5 0 0 1 0 12" />
            </svg>
            <svg id="mute-icon-off" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
              <path d="M4 9v6h4l5 5V4L8 9H4Z" />
              <path d="M16 9l5 6M21 9l-5 6" />
            </svg>
          </button>
        </div>
      </header>

      <section id="stage" class="stage" aria-live="polite">
        <div id="empty-state" class="empty-state">
          <div class="hero-ring" aria-hidden="true">
            <div class="hero-ring-glow"></div>
          </div>
          <div class="hero-content">
            <h1 class="hero-name">Shridhar Pathak</h1>
            <div class="hero-divider"></div>
            <p id="greeting" class="hero-tagline">Ask me anything.</p>
            <p id="sub-greeting" class="hero-subtagline">Tap the microphone, speak, then pause.</p>
          </div>
        </div>

        <div id="exchange" class="exchange" hidden>
          <p class="label">You asked</p>
          <p id="question-text" class="question"></p>
          <p id="parsed-note" class="parsed-note" hidden></p>

          <p class="label answer-label">
            <span id="answer-label">Answer</span>
            <span id="source-chip" class="chip" hidden></span>
          </p>
          <p id="answer-text" class="answer"><span id="answer-typed"></span><span id="caret" class="caret"></span></p>

          <button id="detail-toggle" class="link-btn detail-toggle" type="button" aria-expanded="false" hidden>
            Read the full story
          </button>
          <div id="detail-text" class="detail" hidden></div>
        </div>
      </section>

      <footer class="controls">
        <p id="live-transcript" class="live-transcript" aria-live="polite"></p>
        <p id="status" class="status">Tap to speak</p>

        <div class="button-row">
          <button id="reset-btn" class="icon-btn reset" type="button" aria-label="Start over" title="Start over">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round">
              <path d="M7 7l10 10M17 7L7 17" />
            </svg>
          </button>

          <button id="mic" class="icon-btn mic" type="button" aria-label="Start listening">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a1 1 0 1 1 2 0 7 7 0 0 1-6 6.92V21h3a1 1 0 1 1 0 2H8a1 1 0 1 1 0-2h3v-2.08A7 7 0 0 1 5 12a1 1 0 1 1 2 0 5 5 0 0 0 10 0Z" />
            </svg>
          </button>

          <button id="keyboard-toggle" class="icon-btn keyboard" type="button" aria-label="Type instead" title="Type instead">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="6" width="18" height="12" rx="2.2" />
              <path d="M6.5 10h.01M9.5 10h.01M12.5 10h.01M15.5 10h.01M17.5 10h.01M6.5 13.5h.01M17.5 13.5h.01M9 14h6" />
            </svg>
          </button>
        </div>

        <form id="fallback-form" class="fallback-form" hidden>
          <input
            id="fallback-input"
            class="fallback-input"
            type="text"
            placeholder="Type a question instead"
            autocomplete="off"
          />
          <button class="fallback-send" type="submit">Ask</button>
        </form>
      </footer>
    </main>

    <script src="/parse.js"></script>
    <script src="/orb.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
